AllCops:
  NewCops: enable
  Exclude:
    - 'bin/{bundle,dev,rails,rake,setup}'
    - 'db/schema.rb'
    - 'lib/generators/**/*'
    - 'vendor/**/*'
  DisplayCopNames: true
  TargetRubyVersion: 3.3.1

# --------

Layout/LineLength:
  Max: 131

Style/Documentation:
  Exclude:
    - 'db/migrate/**/*'
    - 'app/**/application_*.rb'
    - 'config/application.rb'

Style/StringLiterals:
  EnforcedStyle: double_quotes
